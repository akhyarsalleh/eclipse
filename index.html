<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Flight Crew License Portal</title>
    <!-- Load the lightweight, cross-platform QR Scanner library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-blue: #3b82f6;
            --status-green: #22c55e;
            --status-orange: #f97316;
            --status-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            max-width: 450px;
            width: 100%;
            background-color: var(--bg-secondary);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Views configuration */
        .view-step { display: none; }
        .view-active { display: flex; flex-direction: column; }

        h1 { font-size: 20px; font-weight: 700; margin: 0; text-align: center; color: var(--text-main); }
        p { font-size: 13px; color: var(--text-muted); text-align: center; margin: 0 0 10px 0; line-height: 1.4; }

        /* Scanner View Styles */
        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background-color: #000;
            border: 2px solid #334155 !important;
            aspect-ratio: 1;
        }

        .status-badge {
            padding: 12px;
            border-radius: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            color: var(--text-muted);
            word-break: break-all;
        }

        /* Loading View Styles */
        .loader-spinner {
            border: 4px solid #334155;
            border-top: 4px solid var(--brand-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Dashboard View Styles */
        .pilot-header {
            background-color: #0f172a;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #334155;
            text-align: left;
        }
        .pilot-name { font-size: 16px; font-weight: 700; color: #fff; text-transform: uppercase; }
        .pilot-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .status-banner {
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .ratings-card {
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid #334155;
            padding: 16px;
        }
        .ratings-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
        }
        .item-row:last-child { border-bottom: none; }
        .item-name { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .item-date { font-size: 12px; text-align: right; }
        .item-sub { font-size: 10px; font-weight: 700; margin-top: 2px; }

        .disclaimer-box {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            padding: 10px;
            background-color: #0f172a;
            border-radius: 10px;
            border: 1px dashed #334155;
        }

        button.btn-primary {
            background-color: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button.btn-primary:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="phone-container">

    <div id="view-scanner" class="view-step view-active">
        <h1>License Scanner</h1>
        <p>Align the CAAM Digital License QR code within the framing boundaries.</p>
        <div id="reader"></div>
        <div id="scanner-status" class="status-badge">Initializing back camera...</div>
    </div>

    <div id="view-loading" class="view-step">
        <h1>Downloading Data</h1>
        <p>Bypassing security filters and fetching verified license structures directly from CAAM...</p>
        <div class="loader-spinner"></div>
    </div>

    <!-- View 3: Safety Dashboard -->
    <div id="view-dashboard" class="view-step">
        ...
    </div>
</div>

</html>
