<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse License Scanner Portal</title>
    <!-- 1. Load the lightweight, cross-platform HTML5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: none !important;
            background-color: #000;
        }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            background-color: #f8fafc;
            border-radius: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Eclipse License Checker</h1>
    <p>Point your camera at the CAAM Digital License QR code to automatically check validation status.</p>
    
    <!-- Camera stream displays here -->
    <div id="reader"></div>
    
    <div id="status" class="status-box">Status: Ready to scan...</div>
</div>

<script>
    // 1. Initialize the raw HTML5 QR Code engine on your target element
    // Using Html5Qrcode instead of Html5QrcodeScanner bypasses all default library UI elements.
    const html5QrCode = new Html5Qrcode("reader");
    
    const qrConfig = { 
        fps: 15, 
        qrbox: { width: 250, height: 250 } 
    };

    function onScanSuccess(decodedText, decodedResult) {
        // Stop scanning programmatically once a match is found
        html5QrCode.stop().then(() => {
            var statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "<b>QR Detected!</b> Processing URL...";
            
            if (decodedText.indexOf("eclipse.caam.gov.my") !== -1) {
                statusDiv.style.color = "#16a34a";
                statusDiv.innerHTML = "<b>Redirecting...</b> Fetching secure license data.";
                processLicenseUrl(decodedText);
            } else {
                statusDiv.style.color = "#dc2626";
                statusDiv.innerHTML = "<b>Error:</b> Invalid QR Code. Must be a CAAM Digital License.";
                // Restart scanner if invalid
                setTimeout(startScanner, 2000);
            }
        }).catch(err => {
            console.warn("Failed to stop scanner", err);
        });
    }

    function processLicenseUrl(caamUrl) {
        // Enforce Cache-Bust & redirect to your serverless CORS proxy endpoint
        const proxyBaseUrl = "https://your-serverless-proxy.vercel.app/api/fetch"; 
        const targetUrl = proxyBaseUrl + "?licenseUrl=" + encodeURIComponent(caamUrl);
        window.location.href = targetUrl;
    }

    function startScanner() {
        var statusDiv = document.getElementById('status');
        statusDiv.style.color = "#475569";
        statusDiv.innerText = "Status: Initializing back camera...";

        // programmatically launch the camera using 'facingMode: "environment"'
        // This forces both iOS Safari and Android Chrome to open the primary rear camera instantly.
        html5QrCode.start(
            { facingMode: "environment" }, 
            qrConfig, 
            onScanSuccess
        ).then(() => {
            statusDiv.innerText = "Status: Align QR code inside the frame.";
        }).catch(err => {
            statusDiv.style.color = "#dc2626";
            statusDiv.innerText = "Camera Access Error: Please ensure camera permission is granted.";
            console.error("Scanning start error:", err);
        });
    }

    // Launch the locked camera scanner automatically when the page loads
    window.addEventListener("DOMContentLoaded", startScanner);
</script>

</body>
</html>
